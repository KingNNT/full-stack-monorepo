name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
  # Deploy runs the full suite as a gate before building release images.
  workflow_call:
    inputs:
      all-projects:
        description: Run every project instead of only affected ones
        type: boolean
        default: false
      docker-build:
        description: Also check that the Docker images build
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.all-projects && 'all' || 'affected' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # On push, compare against the last successful run on the pushed branch;
      # the action defaults to `main`, which does not exist in this repo.
      - uses: nrwl/nx-set-shas@v4
        if: ${{ !inputs.all-projects }}
        with:
          main-branch-name: ${{ github.event_name == 'push' && github.ref_name || github.base_ref }}

      - if: ${{ !inputs.all-projects }}
        run: pnpm nx affected -t lint typecheck test build

      - if: ${{ inputs.all-projects }}
        run: pnpm nx run-many -t lint typecheck test build

  docker-build:
    runs-on: ubuntu-latest
    needs: main
    # inputs are null outside workflow_call, and null == false in expressions.
    if: ${{ format('{0}', inputs.docker-build) != 'false' }}
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: fullstack-monorepo/${{ matrix.app }}:test
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
