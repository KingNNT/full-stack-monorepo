name: Deploy

# Git flow: release/* and hotfix/* deploy to staging; vX.Y.Z tags (cut on main
# by release-finish.yml) deploy to prod. Each environment is a separate AWS
# account, configured as a GitHub Environment holding the AWS_DEPLOY_ROLE_ARN
# secret.
on:
  push:
    branches: ["release/**", "hotfix/**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (prod requires running on a v* tag)"
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  PROJECT: fullstack-monorepo

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # prod rebuilds the images from the tag (staging and prod are separate
      # AWS accounts with separate ECRs). Its source must match what staging
      # tested: the tag is a release/hotfix merge on main, and that merge
      # changes nothing relative to the branch head staging deployed.
      - name: Pick environment
        id: pick
        env:
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          if [[ -n "$INPUT_ENV" ]]; then
            env="$INPUT_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            env=prod
          else
            env=staging
          fi
          if [[ "$env" == "prod" ]]; then
            if ! [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::prod deploys only from a vX.Y.Z tag (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is not on main"
              exit 1
            fi
            if git rev-parse -q --verify "$GITHUB_SHA^2" >/dev/null && ! git diff --quiet "$GITHUB_SHA^2" "$GITHUB_SHA"; then
              echo "::error::$GITHUB_REF_NAME differs from the release/hotfix head staging tested — main had changes the branch lacked"
              exit 1
            fi
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "Deploying $GITHUB_REF_NAME to $env"

  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
    with:
      all-projects: true
      docker-build: false

  deploy:
    runs-on: ubuntu-latest
    needs: [target, ci]
    environment: ${{ needs.target.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both images always get the same tag, so one deploy bundle names a
      # consistent pair.
      - name: Image tags
        id: tags
        run: |
          for app in api web; do
            repo="${{ steps.ecr.outputs.registry }}/${PROJECT}/${app}"
            {
              echo "${app}<<EOF"
              echo "${repo}:${IMAGE_TAG}"
              [[ "$GITHUB_REF_TYPE" == "tag" ]] && echo "${repo}:${GITHUB_REF_NAME}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Upload deploy bundle
        run: |
          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "GIT_SHA=${GITHUB_SHA}"
            echo "GIT_REF=${GITHUB_REF_NAME}"
          } > deploy.env
          zip -qr deploy-bundle.zip deploy.env infra/helm infra/codebuild
          aws s3 cp deploy-bundle.zip "s3://${PROJECT}-${ENVIRONMENT}-deploy-source/deploy-bundle.zip"

      - name: Run pipeline
        run: |
          pipeline="${PROJECT}-${ENVIRONMENT}"
          id=$(aws codepipeline start-pipeline-execution --name "$pipeline" \
            --query pipelineExecutionId --output text)
          echo "Started $pipeline execution $id"
          echo "https://${AWS_REGION}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${pipeline}/executions/${id}/timeline" >> "$GITHUB_STEP_SUMMARY"

          # prod waits on a manual approval stage; stop watching after ~100 min.
          for _ in $(seq 1 200); do
            status=$(aws codepipeline get-pipeline-execution --pipeline-name "$pipeline" \
              --pipeline-execution-id "$id" --query pipelineExecution.status --output text)
            case "$status" in
              Succeeded) echo "Pipeline succeeded"; exit 0 ;;
              Failed|Stopped|Stopping|Superseded|Cancelled)
                echo "::error::Pipeline $pipeline ended with status $status"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::warning::Pipeline $pipeline still $status; follow it in the CodePipeline console"
