name: Infrastructure Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.9.8"

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    name: Plan (${{ matrix.environment }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: matrix.environment != 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('{0}_DEPLOY_ROLE_ARN', matrix.environment)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform/envs/${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "plan<<PLAN_EOF" >> "$GITHUB_OUTPUT"
          cat plan.txt >> "$GITHUB_OUTPUT"
          echo "PLAN_EOF" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Comment PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Terraform Plan — `${{ matrix.environment }}`

            <details>
            <summary>Show plan</summary>

            ```
            ${{ steps.plan.outputs.plan }}
            ```

            </details>

            **Result:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1
