# Everything runs in containers; Mailpit SMTP stays on the compose network.
# Published ports bind to loopback only; override host ports from the shell.
services:
  postgres:
    ports:
      - "127.0.0.1:${HOST_MACHINE_POSTGRES_PORT:-5432}:5432"

  api:
    build:
      target: dev
    # Run as the host user so files written into the bind-mounted checkout
    # (dist/, next-env.d.ts, …) are not owned by root on Linux. The
    # local:docker:up* tasks export these; plain `docker compose` uses 1000.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    ports:
      - "127.0.0.1:${HOST_MACHINE_API_PORT:-8000}:8000"
      # Drizzle Studio (mise run local:db:studio)
      - "127.0.0.1:${HOST_MACHINE_DRIZZLE_STUDIO_PORT:-4983}:4983"

  mailpit:
    ports:
      - "127.0.0.1:${HOST_MACHINE_MAILPIT_PORT:-8025}:8025"

  web:
    build:
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    ports:
      - "127.0.0.1:${HOST_MACHINE_WEB_PORT:-3000}:3000"
