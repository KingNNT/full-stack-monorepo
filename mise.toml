[tools]
node = "lts"
pnpm = "11"

# Short aliases for the most common daily commands
[tasks.dev]
description = "Start all containers with hot reload"
depends = ["local:docker:up"]

[tasks.lint]
description = "Lint all apps"
depends = ["local:lint"]

[tasks.test]
description = "Run unit tests for all apps"
depends = ["local:test"]

[tasks.typecheck]
description = "Typecheck all apps"
depends = ["local:typecheck"]
