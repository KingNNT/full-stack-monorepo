replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  minReplicas: 3
  maxReplicas: 10

pdb:
  enabled: true
  minAvailable: 2

ingress:
  host: api.example.com
  certificateArn: ""

env:
  NODE_ENV: production
  API_PORT: "8000"
  LOG_LEVEL: warn
  CORS_ALLOWED_ORIGINS: https://example.com
  MAIL_TRANSPORT: ses
  MAIL_FROM: "FullStack Monorepo <no-reply@example.com>"
  SES_CONFIGURATION_SET: fullstack-monorepo-prod
  AWS_REGION: ap-southeast-1
  WEB_APP_URL: https://example.com
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317

secrets: {}
