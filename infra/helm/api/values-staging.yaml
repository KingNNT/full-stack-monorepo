replicaCount: 2

ingress:
  host: api.staging.example.com
  certificateArn: ""

env:
  NODE_ENV: production
  API_PORT: "8000"
  LOG_LEVEL: info
  CORS_ALLOWED_ORIGINS: https://staging.example.com
  MAIL_TRANSPORT: ses
  MAIL_FROM: "FullStack Monorepo <no-reply@staging.example.com>"
  SES_CONFIGURATION_SET: fullstack-monorepo-staging
  AWS_REGION: ap-southeast-1
  WEB_APP_URL: https://staging.example.com
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317

secrets: {}
