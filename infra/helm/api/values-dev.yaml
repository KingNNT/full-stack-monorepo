replicaCount: 1

image:
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: api.localhost

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

pdb:
  enabled: false

env:
  NODE_ENV: development
  PORT: "8000"
  LOG_LEVEL: debug
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317

secrets:
  DATABASE_URL: postgresql://postgres:password@postgres.dev.svc.cluster.local:5432/inviduality_dev
  JWT_ACCESS_SECRET: dev-access-secret-min-32-chars-long-here
  JWT_REFRESH_SECRET: dev-refresh-secret-min-32-chars-long
