replicaCount: 1

image:
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: api.localhost

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

pdb:
  enabled: false

env:
  NODE_ENV: development
  API_PORT: "8000"
  LOG_LEVEL: debug
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  MAIL_TRANSPORT: ses
  MAIL_FROM: "FullStack Monorepo <no-reply@example.com>"
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://host.docker.internal:4566
  WEB_APP_URL: http://localhost:3000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317

secrets:
  DATABASE_URL: postgresql://postgres:password@postgres.dev.svc.cluster.local:5432/fullstack_monorepo_dev
  JWT_ACCESS_SECRET: dev-access-secret-min-32-chars-long-here
  JWT_REFRESH_SECRET: dev-refresh-secret-min-32-chars-long
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
