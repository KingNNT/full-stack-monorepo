replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  minReplicas: 3
  maxReplicas: 8

pdb:
  enabled: true
  minAvailable: 2

ingress:
  host: example.com
  certificateArn: ""

env:
  API_BASE_URL: http://api:8000
  AUTH_URL: https://example.com
  APP_URL: https://example.com

secrets: {}
