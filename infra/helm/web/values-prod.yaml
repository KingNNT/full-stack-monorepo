replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  minReplicas: 3
  maxReplicas: 8

pdb:
  enabled: true
  minAvailable: 2

ingress:
  host: example.com
  certificateArn: ""

env:
  NEXT_PUBLIC_API_BASE_URL: https://api.example.com
  NEXTAUTH_URL: https://example.com

secrets: {}
